name: Supabase keep-alive

on:
  schedule:
    - cron: '0 9 */3 * *'   # кожні 3 дні о 09:00 UTC
  workflow_dispatch:         # можна запустити вручну

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (реальний запит до таблиці products)
        env:
          SUPABASE_URL: https://hsrfoepbcoyouvtobjhx.supabase.co
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzcmZvZXBiY295b3V2dG9iamh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTYwMzUsImV4cCI6MjA5NDIzMjAzNX0.10GQQM59H5cm_km4Ru4d5Dz0JRXw4Zz3LU1yaNsoVkA
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase відповів: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Помилка пінгу" && exit 1
          fi
